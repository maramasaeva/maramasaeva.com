<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#181716"/><text x="72" y="60" fill="#a8a69f" font-family="monospace" font-size="18">mcp-server-starter / src/server.py</text><path d="M72 90H1128" stroke="#373431"/><g font-family="monospace" font-size="21"><text x="72" y="150" fill="#f19ab8">async def get_workflow() -&gt; dict:</text><text x="72" y="179" fill="#ddd8d0">    &quot;&quot;&quot;</text><text x="72" y="208" fill="#ddd8d0">    get the workflow for this server. call this first.</text><text x="72" y="237" fill="#ddd8d0"></text><text x="72" y="266" fill="#ddd8d0">    returns the learn→generate→validate steps in order,</text><text x="72" y="295" fill="#ddd8d0">    with descriptions and rules for each phase.</text><text x="72" y="324" fill="#ddd8d0">    &quot;&quot;&quot;</text><text x="72" y="353" fill="#ddd8d0">    return get_workflow_steps()</text><text x="72" y="382" fill="#ddd8d0"></text><text x="72" y="411" fill="#ddd8d0"></text><text x="72" y="440" fill="#ddd8d0">@mcp.tool()</text><text x="72" y="469" fill="#f19ab8">async def learn(domain: str = &quot;default&quot;, force_refresh: bool = False) -&gt; dict:</text><text x="72" y="498" fill="#ddd8d0">    &quot;&quot;&quot;</text><text x="72" y="527" fill="#ddd8d0">    load a style profile for the given domain.</text><text x="72" y="556" fill="#ddd8d0"></text><text x="72" y="585" fill="#ddd8d0">    learns tone, structure, vocabulary, and patterns from reference material.</text><text x="72" y="614" fill="#ddd8d0">    caches the result for 24 hours. use force_refresh to rebuild.</text><text x="72" y="643" fill="#ddd8d0"></text></g><text x="72" y="711" fill="#a8a69f" font-family="monospace" font-size="15">original source excerpt</text></svg>