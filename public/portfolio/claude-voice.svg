<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#181716"/><text x="72" y="60" fill="#a8a69f" font-family="monospace" font-size="18">claude-voice / voice.py</text><path d="M72 90H1128" stroke="#373431"/><g font-family="monospace" font-size="21"><text x="72" y="150" fill="#b8d2c7">def ensure_chimes():</text><text x="72" y="179" fill="#ddd8d0">    &quot;&quot;&quot;Generate chime files if they don&#x27;t exist.&quot;&quot;&quot;</text><text x="72" y="208" fill="#ddd8d0">    import numpy as np</text><text x="72" y="237" fill="#ddd8d0">    import wave as wav</text><text x="72" y="266" fill="#ddd8d0"></text><text x="72" y="295" fill="#ddd8d0">    if not os.path.exists(WAKE_CHIME):</text><text x="72" y="324" fill="#ddd8d0">        rate = 44100</text><text x="72" y="353" fill="#ddd8d0">        t = np.linspace(0, 0.25, int(rate * 0.25), False)</text><text x="72" y="382" fill="#ddd8d0">        tone = 0.4 * np.sin(2 * np.pi * 880 * t) + 0.2 * np.sin(2 * np.pi * </text><text x="72" y="411" fill="#ddd8d0">1320 * t)</text><text x="72" y="440" fill="#ddd8d0">        tone *= np.linspace(1, 0, len(tone)) ** 2</text><text x="72" y="469" fill="#ddd8d0">        wf = wav.open(WAKE_CHIME, &#x27;w&#x27;)</text><text x="72" y="498" fill="#ddd8d0">        wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(rate)</text><text x="72" y="527" fill="#ddd8d0">        wf.writeframes((tone * 32767).astype(np.int16).tobytes())</text><text x="72" y="556" fill="#ddd8d0">        wf.close()</text><text x="72" y="585" fill="#ddd8d0"></text><text x="72" y="614" fill="#ddd8d0">    if not os.path.exists(DONE_CHIME):</text><text x="72" y="643" fill="#ddd8d0">        rate = 44100</text></g><text x="72" y="711" fill="#a8a69f" font-family="monospace" font-size="15">original source excerpt</text></svg>