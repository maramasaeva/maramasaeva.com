<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#181716"/><text x="72" y="60" fill="#a8a69f" font-family="monospace" font-size="18">GoodreadsTBR_Deslegte / GoodreadsTBR_Deslegte.py</text><path d="M72 90H1128" stroke="#373431"/><g font-family="monospace" font-size="21"><text x="72" y="150" fill="#d9c3a3">def get_goodreads_to_read_list(url):</text><text x="72" y="179" fill="#d9c3a3">    # Set up Selenium WebDriver (using Chrome in this example)</text><text x="72" y="208" fill="#ddd8d0">    print(&quot;\nOpening Goodreads list. Please wait...&quot;)</text><text x="72" y="237" fill="#ddd8d0">    driver = webdriver.Chrome()</text><text x="72" y="266" fill="#ddd8d0"></text><text x="72" y="295" fill="#ddd8d0">    try:</text><text x="72" y="324" fill="#d9c3a3">        # Open the Goodreads page</text><text x="72" y="353" fill="#ddd8d0">        driver.get(url)</text><text x="72" y="382" fill="#ddd8d0">        </text><text x="72" y="411" fill="#d9c3a3">        # Initialize an empty list to store all book titles</text><text x="72" y="440" fill="#ddd8d0">        all_books = []</text><text x="72" y="469" fill="#ddd8d0">        </text><text x="72" y="498" fill="#ddd8d0">        while True:</text><text x="72" y="527" fill="#d9c3a3">            # Wait for the page to load completely</text><text x="72" y="556" fill="#ddd8d0">            try:</text><text x="72" y="585" fill="#ddd8d0">                WebDriverWait(driver, 10).until(</text><text x="72" y="614" fill="#ddd8d0">                    EC.presence_of_element_located((By.CSS_SELECTOR, </text><text x="72" y="643" fill="#ddd8d0">&#x27;td.field.title div.value a&#x27;))</text></g><text x="72" y="711" fill="#a8a69f" font-family="monospace" font-size="15">original source excerpt</text></svg>